name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.18', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false # zero dependencies, no go.sum to key on
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - run: go test -fuzz='^FuzzValid$' -fuzztime=30s .
      - run: go test -fuzz='^FuzzFormat$' -fuzztime=30s .
      - run: go test -fuzz='^FuzzValidStrict$' -fuzztime=30s .
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.go == 'stable'
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: pzentenoe/chilerut

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
